<svg width="1000" height="80" viewBox="0 0 1000 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated circuit divider</title>
  <desc id="desc">A neon circuit divider line.</desc>
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="0.75" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1000 0" to="1000 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M30 40 H230 L270 18 H390 L430 40 H570 L610 62 H730 L770 40 H970" stroke="url(#pulse)" stroke-width="3" filter="url(#glow)" stroke-linecap="round"/>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="230" cy="40" r="5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="40" r="5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="40" r="5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
