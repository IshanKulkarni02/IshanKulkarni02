<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated neural interface panel</title>
  <desc id="desc">A futuristic blue and cyan interface grid for AI, robotics, and full-stack systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#062a3f"/>
    </linearGradient>
    <linearGradient id="line" x1="60" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#1f3b66" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="278" rx="21" stroke="#22d3ee" stroke-opacity="0.22"/>
  <rect width="1000" height="280" rx="22" fill="url(#grid)" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="42 42" dur="9s" repeatCount="indefinite"/>
  </rect>

  <path d="M80 150 H230 L285 92 H430 L490 150 H650 L705 96 H870 L920 150" stroke="url(#line)" stroke-width="3" filter="url(#glow)" opacity="0.9">
    <animate attributeName="stroke-dasharray" values="20 18;2 18;20 18" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M110 205 H270 L335 158 H465 L525 205 H680 L740 160 H900" stroke="#38bdf8" stroke-width="1.5" opacity="0.45">
    <animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#glow)">
    <circle cx="230" cy="150" r="7" fill="#22d3ee">
      <animate attributeName="r" values="5;9;5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="92" r="6" fill="#60a5fa">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="150" r="7" fill="#a855f7">
      <animate attributeName="r" values="5;10;5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="96" r="6" fill="#22d3ee">
      <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="62" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700">SYSTEM ONLINE</text>
  <text x="60" y="94" fill="#e0f2fe" font-family="JetBrains Mono, Consolas, monospace" font-size="34" font-weight="800">AI x Robotics x Product Engineering</text>
  <text x="60" y="234" fill="#67e8f9" font-family="JetBrains Mono, Consolas, monospace" font-size="18">building interfaces where software meets the physical world</text>

  <g opacity="0.9">
    <rect x="720" y="190" width="210" height="34" rx="17" fill="#020617" stroke="#2563eb" stroke-opacity="0.8"/>
    <text x="825" y="213" text-anchor="middle" fill="#93c5fd" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">DESKPANDA.IO</text>
  </g>
</svg>
